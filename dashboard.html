
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کتابخانه من | PIKSO GAMES</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #09090f;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
        }

        header {
            background: #11111b;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid #302344;
        }

        .logo {
            color: #a855f7;
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            width: 84%;
            margin: 50px auto;
        }

        h1 {
            color: #c084fc;
            margin-bottom: 15px;
        }

        .welcome {
            color: #aaa;
            margin-bottom: 40px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 320px));
            gap: 25px;
        }

        .game-card {
            background: #151521;
            border: 1px solid #302344;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: #a855f7;
        }

        .game-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .game-info {
            padding: 22px;
        }

        .game-info h2 {
            font-size: 21px;
            margin-bottom: 15px;
        }

        .free {
            display: inline-block;
            background: #153c29;
            color: #65e6a0;
            padding: 7px 15px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .download {
            display: block;
            text-align: center;
            background: #9333ea;
            color: white;
            padding: 13px;
            text-decoration: none;
            border-radius: 9px;
        }

        .download:hover {
            background: #7e22ce;
        }

        .logout {
            background: #7e22ce;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .message {
            color: #fca5a5;
            margin-top: 25px;
        }

        @media(max-width: 600px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">PIKSO GAMES</div>
    <button class="logout" onclick="logout()">خروج از حساب</button>
</header>

<main class="container">
    <h1>کتابخانه بازی‌های من</h1>

    <p class="welcome" id="welcome">
        در حال بررسی حساب کاربری...
    </p>

    <div class="games">

        <div class="game-card">
            <img
                src="IMG_20261106_004502_679.jpg"
                alt="WOLF RACING"
            >

            <div class="game-info">
                <h2>WOLF RACING</h2>

                <div class="free">رایگان</div>

                <a
                    class="download"
                    href="https://www.picofile.com/f/tN9NxENv5s/pixo-games.zip"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    دانلود دوباره بازی
                </a>
            </div>
        </div>

    </div>

    <p class="message" id="message"></p>
</main>

<script>
async function checkLogin() {
    try {
        const response = await fetch("/api/me", {
            credentials: "same-origin"
        });

        if (!response.ok) {
            window.location.href = "login.html";
            return;
        }

        const user = await response.json();

        document.getElementById("welcome").textContent =
            "خوش آمدی " + user.username + " عزیز!";

    } catch (error) {
        document.getElementById("welcome").textContent =
            "ارتباط با سرور برقرار نشد.";
    }
}

async function logout() {
    try {
        const response = await fetch("/api/logout", {
            method: "POST",
            credentials: "same-origin"
        });

        if (response.ok) {
            window.location.href = "login.html";
        } else {
            document.getElementById("message").textContent =
                "خروج از حساب انجام نشد.";
        }
    } catch (error) {
        document.getElementById("message").textContent =
            "ارتباط با سرور برقرار نشد.";
    }
}

checkLogin();
</script>

</body>
</html>
